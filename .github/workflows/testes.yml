name: Testes

on:
  push:
    branches: ["**"]
  pull_request:

env:
  PGHOST: localhost
  PGPASSWORD: postgres
  POSTGRES_USER: postgres
  DB_OWNER_PASSWORD: owner_ci
  DB_APP_PASSWORD: app_ci
  JWT_SECRET: segredo-apenas-para-ci-com-mais-de-32-caracteres
  DATABASE_URL: postgresql+asyncpg://saas_app:app_ci@localhost:5432/saas_pilates
  MIGRATION_DATABASE_URL: postgresql+asyncpg://saas_owner:owner_ci@localhost:5432/saas_pilates
  REDIS_URL: redis://localhost:6379/0
  TEST_DATABASE_URL: postgresql+asyncpg://saas_app:app_ci@localhost:5432/saas_pilates_test
  TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://saas_owner:owner_ci@localhost:5432/saas_pilates_test
  TEST_REDIS_URL: redis://localhost:6379/15

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Cria papéis e bancos (mesmo script do docker compose)
        run: bash docker/postgres/init-db.sh
      - run: pytest -v

  frontend:
    name: Frontend (npm test + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  e2e:
    name: Navegador (Playwright contra a API real)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Sobe a API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          bash docker/postgres/init-db.sh
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Teste de ponta a ponta
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        run: cat /tmp/api.log
